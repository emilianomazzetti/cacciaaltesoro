<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>ESERCIZIO 9</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; text-transform: uppercase; }
        .card { background: white; padding: 20px; border: 1px solid #ccc; max-width: 600px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; }
        .result { margin-top: 15px; font-weight: bold; font-size: 1.2em; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ESERCIZIO 9: GEOGRAFIA DELLE CITTÀ MICENEE</h2>
        <p>SELEZIONA LE QUATTRO CITTÀ-FORTEZZA CITATE ESPLICITAMENTE NEL TESTO COME PIÙ IMPORTANTI:</p>
        <p><input type="checkbox" class="city" value="MICENE"> MICENE</p>
        <p><input type="checkbox" class="city" value="ATENE"> ATENE</p>
        <p><input type="checkbox" class="city" value="TIRINTO"> TIRINTO</p>
        <p><input type="checkbox" class="city" value="ARGO"> ARGO</p>
        <p><input type="checkbox" class="city" value="PILO"> PILO</p>
        <p><input type="checkbox" class="city" value="SPARTA"> SPARTA</p>
        <button onclick="check()">VERIFICA CITTÀ</button>
        <p id="ans" class="result"></p>
    </div>

    <script>
        function playAudio(isCorrect) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (isCorrect) {
                const now = ctx.currentTime;
                const osc1 = ctx.createOscillator();
                const osc2 = ctx.createOscillator();
                const gain = ctx.createGain();
                osc1.type = 'sine';
                osc2.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, now);
                osc2.frequency.setValueAtTime(659.25, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(ctx.destination);
                osc1.start(now);
                osc1.stop(now + 0.15);
                osc2.start(now + 0.15);
                osc2.stop(now + 0.5);
            } else {
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.4);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        function check() {
            let selected = Array.from(document.querySelectorAll('.city:checked')).map(e => e.value);
            let correct = ["MICENE", "TIRINTO", "ARGO", "PILO"];
            let ans = document.getElementById('ans');
            
            let isCorrect = selected.length === correct.length && selected.every(val => correct.includes(val));
            
            if(isCorrect) {
                playAudio(true);
                ans.className = "result success";
                ans.innerText = "CORRETTO! ECCO LA NONA LETTERA DELLA PAROLA SEGRETA: N";
            } else {
                playAudio(false);
                ans.className = "result error";
                ans.innerText = "ERRORE! RILEGGI IL PRIMO PARAGRAFO SULLE CITTÀ MICENEE.";
            }
        }
    </script>
</body>
</html>
