<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>ESERCIZIO 4</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; text-transform: uppercase; }
        .item { margin-bottom: 15px; }
        select { padding: 5px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; }
        .result { margin-top: 15px; font-weight: bold; font-size: 1.2em; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h2>ESERCIZIO 4: ARCHAEOLOGIA E CRONOLOGIA</h2>
    <div class="item">
        <label>1. IN QUALE ANNO HEINRICH SCHLIEMANN SCOPRÌ I RESTI DELL'ANTICA CITTÀ-FORTEZZA?</label><br>
        <select id="d1">
            <option value="">SELEZIONA</option>
            <option value="1874">1874</option>
            <option value="1876">1876</option>
            <option value="1999">1999</option>
        </select>
    </div>
    <div class="item">
        <label>2. IN QUALE ANNO FU RITROVATA LA CELEBRE MASCHERA D'ORO IN UNA TOMBA REALE?</label><br>
        <select id="d2">
            <option value="">SELEZIONA</option>
            <option value="1874">1874</option>
            <option value="1876">1876</option>
            <option value="1999">1999</option>
        </select>
    </div>
    <div class="item">
        <label>3. IN QUALE ANNO L'UNESCO HA DICHIARATO IL SITO PATRIMONIO DELL'UMANITÀ?</label><br>
        <select id="d3">
            <option value="">SELEZIONA</option>
            <option value="1874">1874</option>
            <option value="1876">1876</option>
            <option value="1999">1999</option>
        </select>
    </div>
    <button onclick="valida()">VERIFICA DATE</button>
    <p id="res" class="result"></p>

    <script>
        function playAudio(isCorrect) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (isCorrect) {
                const now = ctx.currentTime;
                const osc1 = ctx.createOscillator();
                const osc2 = ctx.createOscillator();
                const gain = ctx.createGain();
                osc1.type = 'sine';
                osc2.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, now);
                osc2.frequency.setValueAtTime(659.25, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(ctx.destination);
                osc1.start(now);
                osc1.stop(now + 0.15);
                osc2.start(now + 0.15);
                osc2.stop(now + 0.5);
            } else {
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.4);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        function valida() {
            let res = document.getElementById('res');
            if(document.getElementById('d1').value === '1874' && 
               document.getElementById('d2').value === '1876' && 
               document.getElementById('d3').value === '1999') {
                playAudio(true);
                res.className = "result success";
                res.innerText = "CORRETTO! ECCO LA QUARTA LETTERA DELLA PAROLA SEGRETA: M";
            } else {
                playAudio(false);
                res.className = "result error";
                res.innerText = "DATE NON CORRETTE! VERIFICA LE DATE NEL TESTO PRIMA DI RIPROVARE.";
            }
        }
    </script>
</body>
</html>
