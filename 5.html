<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>ESERCIZIO 6</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; text-transform: uppercase; }
        .card { background: white; padding: 20px; border: 1px solid #ccc; max-width: 600px; }
        select, input { padding: 5px; margin-bottom: 10px; text-transform: uppercase; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; }
        .result { margin-top: 15px; font-weight: bold; font-size: 1.2em; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ESERCIZIO 6: IL TESORO DI ATREO</h2>
        <p>1. COME SI CHIAMA LA FAMOSA TOMBA A TUMULO SITUATA FUORI DALLE MURA DI MICENE?</p>
        <input type="text" id="t1" placeholder="NOME DELLA TOMBA"><br>

        <p>2. QUANTO MISURA IL DIAMETRO DELLA SUA SALA INTERNA ROTONDA?</p>
        <select id="t2">
            <option value="">SELEZIONA DIAMETRO</option>
            <option value="10">10 METRI</option>
            <option value="14.5">14,5 METRI</option>
            <option value="20">20 METRI</option>
        </select><br><br>

        <button onclick="valida()">VERIFICA RISPOSTA</button>
        <p id="out" class="result"></p>
    </div>

    <script>
        function playAudio(isCorrect) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (isCorrect) {
                const now = ctx.currentTime;
                const osc1 = ctx.createOscillator();
                const osc2 = ctx.createOscillator();
                const gain = ctx.createGain();
                osc1.type = 'sine';
                osc2.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, now);
                osc2.frequency.setValueAtTime(659.25, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(ctx.destination);
                osc1.start(now);
                osc1.stop(now + 0.15);
                osc2.start(now + 0.15);
                osc2.stop(now + 0.5);
            } else {
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.4);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        function valida() {
            let t1 = document.getElementById('t1').value.trim().toUpperCase();
            let t2 = document.getElementById('t2').value;
            let out = document.getElementById('out');

            if((t1.includes('TESORO DI ATREO') || t1.includes('ATREO')) && t2 === '14.5') {
                playAudio(true);
                out.className = "result success";
                out.innerText = "CORRETTO! ECCO LA SESTA LETTERA DELLA PAROLA SEGRETA: N";
            } else {
                playAudio(false);
                out.className = "result error";
                out.innerText = "INCORRETTO! RIPASSA I DATI SULLA TOMBA A TUMULO.";
            }
        }
    </script>
</body>
</html>
